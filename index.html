<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Simone's Sweet 16 — Save the Date</title>
<link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@400;700&family=Montserrat:wght@300;400;600;700&display=swap" rel="stylesheet"/>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  :root {
    --hot-pink: #e8175d;
    --hot-pink-dark: #c01050;
    --light-pink: #f7c8d8;
    --pale-pink: #fce8f0;
    --dark: #1a1a1a;
    --darker: #0d0d0d;
    --white: #ffffff;
  }
  html, body { height: 100%; }
  body {
    font-family: 'Montserrat', sans-serif;
    background: var(--darker);
    overflow-x: hidden;
    color: var(--white);
  }

  /* ── STAGE ── */
  .stage {
    position: relative;
    min-height: 100vh;
    background:
      radial-gradient(ellipse at 50% 30%, #2a1820 0%, var(--darker) 65%);
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 30px 20px;
    overflow: hidden;
  }
  .stage::before {
    content: '';
    position: absolute; inset: 0;
    background: repeating-linear-gradient(135deg, transparent 0px, transparent 28px, rgba(232,23,93,0.03) 28px, rgba(232,23,93,0.03) 56px);
    pointer-events: none;
  }

  /* sparkles */
  .sparkles { position: absolute; inset: 0; pointer-events: none; overflow: hidden; }
  .sparkles span {
    position: absolute;
    width: 3px; height: 3px;
    background: var(--hot-pink);
    border-radius: 50%;
    opacity: 0;
    animation: sparkle 4s linear infinite;
    box-shadow: 0 0 6px var(--hot-pink);
  }
  @keyframes sparkle {
    0%, 100% { opacity: 0; transform: scale(0); }
    50% { opacity: 0.7; transform: scale(1); }
  }

  /* ── ENVELOPE ── */
  .envelope-wrap {
    position: relative;
    z-index: 5;
    display: flex;
    flex-direction: column;
    align-items: center;
    transition: opacity 0.6s ease, transform 0.6s ease;
  }
  .envelope {
    position: relative;
    width: min(360px, 85vw);
    height: min(240px, calc(85vw * 0.66));
    cursor: pointer;
    animation: float 4s ease-in-out infinite;
    filter: drop-shadow(0 20px 50px rgba(232,23,93,0.3)) drop-shadow(0 8px 20px rgba(0,0,0,0.5));
  }
  @keyframes float {
    0%, 100% { transform: translateY(0); }
    50%      { transform: translateY(-6px); }
  }
  .envelope:hover { animation-play-state: paused; transform: translateY(-4px) scale(1.02); transition: transform 0.3s; }

  /* envelope layers */
  .env-back {
    position: absolute; inset: 0;
    background: linear-gradient(145deg, #f9d6e7 0%, #e8175d 100%);
    border-radius: 6px;
    z-index: 1;
  }
  .env-front {
    position: absolute; inset: 0;
    background: linear-gradient(180deg, #fce8f0 0%, #f7c8d8 100%);
    clip-path: polygon(0 45%, 50% 100%, 100% 45%, 100% 100%, 0 100%);
    border-radius: 0 0 6px 6px;
    z-index: 4;
  }
  .env-front::before {
    content: '';
    position: absolute; inset: 0;
    background: linear-gradient(45deg, transparent 49%, rgba(232,23,93,0.12) 50%, transparent 51%);
    clip-path: polygon(0 45%, 50% 100%, 100% 45%, 100% 100%, 0 100%);
  }
  .env-flap {
    position: absolute; top: 0; left: 0; right: 0;
    height: 100%;
    background: linear-gradient(180deg, #e8175d 0%, #b50e48 100%);
    clip-path: polygon(0 0, 100% 0, 50% 48%);
    transform-origin: top center;
    transform: rotateX(0deg);
    transition: transform 0.9s cubic-bezier(0.6, -0.3, 0.7, 0.5);
    z-index: 5;
  }

  /* WAX SEAL — SVG for authentic drip edges */
  .env-seal {
    position: absolute;
    top: 48%; left: 50%;
    width: 90px; height: 90px;
    transform: translate(-50%, -50%);
    z-index: 10;
    pointer-events: none;
    filter: drop-shadow(0 6px 12px rgba(0,0,0,0.7));
    transition: opacity 0.3s, transform 0.4s ease-in;
    object-fit: contain;
    transform-origin: center center;
  }
  .stage[data-state="closed"] .env-seal {
    animation: sealWiggle 2.6s ease-in-out infinite;
  }
  @keyframes sealWiggle {
    0%, 100% { transform: translate(-50%, -50%) rotate(0deg); }
    25%      { transform: translate(-50%, -50%) rotate(-4deg); }
    75%      { transform: translate(-50%, -50%) rotate(4deg); }
  }

  /* open hint */
  .open-hint {
    margin-top: 32px;
    text-align: center;
    font-size: 11px;
    font-weight: 600;
    letter-spacing: 0.35em;
    text-transform: uppercase;
    color: rgba(255,255,255,0.45);
    animation: pulse 2.2s ease-in-out infinite;
    transition: opacity 0.3s;
  }
  @keyframes pulse {
    0%, 100% { opacity: 0.35; }
    50%      { opacity: 1; }
  }

  /* ── CARD ── */
  .card-stage {
    position: absolute;
    top: 50%; left: 50%;
    transform: translate(-50%, -50%) scale(0.4);
    opacity: 0;
    pointer-events: none;
    z-index: 3;
    width: min(420px, calc(100vw - 40px));
    perspective: 2000px;
    transition: transform 0.9s cubic-bezier(0.34, 1.4, 0.64, 1) 0.3s,
                opacity 0.5s ease 0.4s;
  }

  .card-3d {
    position: relative;
    width: 100%;
    transform-style: preserve-3d;
    transition: transform 1s cubic-bezier(0.7, 0, 0.3, 1);
    display: grid;
  }
  .card-face {
    grid-column: 1; grid-row: 1;
    backface-visibility: hidden;
    -webkit-backface-visibility: hidden;
    border-radius: 6px;
    overflow: hidden;
    box-shadow: 0 24px 60px rgba(232,23,93,0.25), 0 10px 25px rgba(0,0,0,0.4);
  }

  /* FRONT */
  .card-front {
    background: var(--white);
    display: flex;
    flex-direction: column;
    align-items: center;
    padding-bottom: 20px;
  }
  .invite-img {
    width: 100%;
    display: block;
    border-radius: 6px 6px 0 0;
  }
  .card-rsvp-btn {
    margin: 16px 24px 4px;
    padding: 14px 36px;
    background: var(--hot-pink);
    color: #fff;
    border: none;
    border-radius: 3px;
    font-family: 'Montserrat', sans-serif;
    font-size: 12px;
    font-weight: 700;
    letter-spacing: 0.3em;
    text-transform: uppercase;
    cursor: pointer;
    transition: background 0.2s, transform 0.1s, box-shadow 0.2s;
    box-shadow: 0 6px 18px rgba(232,23,93,0.35);
  }
  .card-rsvp-btn:hover { background: var(--hot-pink-dark); transform: translateY(-2px); box-shadow: 0 10px 26px rgba(232,23,93,0.5); }
  .card-rsvp-btn:active { transform: translateY(0); }
  .card-rsvp-hint {
    margin-top: 8px;
    font-size: 9px;
    color: #aaa;
    letter-spacing: 0.25em;
    text-transform: uppercase;
  }

  /* BACK */
  .card-back {
    transform: rotateY(180deg);
    background: var(--white);
    padding: 32px 28px;
    border-top: 5px solid var(--hot-pink);
  }
  .form-title {
    font-family: 'Dancing Script', cursive;
    font-size: 36px;
    color: var(--hot-pink);
    text-align: center;
    margin-bottom: 4px;
    line-height: 1;
  }
  .form-sub {
    text-align: center;
    font-size: 10px;
    font-weight: 600;
    letter-spacing: 0.3em;
    color: #888;
    text-transform: uppercase;
    margin-bottom: 22px;
  }
  .form-group { margin-bottom: 14px; }
  .form-group label {
    display: block; font-size: 10px; font-weight: 700;
    letter-spacing: 0.2em; text-transform: uppercase;
    color: #888; margin-bottom: 5px;
  }
  .form-group label .req { color: var(--hot-pink); }
  .form-group label .opt { color: #bbb; font-weight: 400; text-transform: none; letter-spacing: 0; font-size: 10px; }
  .form-group input, .form-group select, .form-group textarea {
    width: 100%; padding: 10px 12px; border: 1.5px solid #ddd;
    border-radius: 3px; font-family: 'Montserrat', sans-serif;
    font-size: 13px; color: var(--dark);
    transition: border-color 0.2s; background: #fafafa;
    outline: none; -webkit-appearance: none;
  }
  .form-group textarea { resize: vertical; min-height: 60px; }
  .form-group input:focus, .form-group select:focus, .form-group textarea:focus {
    border-color: var(--hot-pink); background: #fff;
  }
  .form-group input.error, .form-group select.error { border-color: #ff3366; background: #fff5f7; }
  .form-row { display: flex; gap: 10px; }
  .form-row .form-group { flex: 1; }

  .hp-field { position: absolute; left: -9999px; top: -9999px; width: 1px; height: 1px; opacity: 0; pointer-events: none; }

  .btn-submit {
    width: 100%; padding: 14px; background: var(--hot-pink);
    color: #fff; border: none; border-radius: 3px;
    font-family: 'Montserrat', sans-serif; font-size: 12px;
    font-weight: 700; letter-spacing: 0.3em; text-transform: uppercase;
    cursor: pointer; transition: background 0.2s, transform 0.1s;
    margin-top: 6px;
  }
  .btn-submit:hover:not(:disabled) { background: var(--hot-pink-dark); }
  .btn-submit:active:not(:disabled) { transform: scale(0.98); }
  .btn-submit:disabled { background: #888; cursor: wait; }

  .btn-back {
    background: none; border: none;
    font-size: 10px; letter-spacing: 0.2em; text-transform: uppercase;
    color: #999; cursor: pointer; margin-top: 12px;
    width: 100%; padding: 6px;
    transition: color 0.2s;
  }
  .btn-back:hover { color: var(--hot-pink); }

  .form-error-msg {
    background: #fff5f7; border: 1.5px solid #ff3366; color: #c01040;
    padding: 10px 12px; border-radius: 3px; font-size: 12px;
    margin-bottom: 12px; display: none;
  }

  /* SUCCESS */
  .success-msg { display: none; text-align: center; padding: 24px 8px 12px; }
  .check-icon {
    width: 60px; height: 60px; background: var(--hot-pink);
    border-radius: 50%; display: flex; align-items: center;
    justify-content: center; margin: 0 auto 16px;
    font-size: 28px; color: #fff;
    box-shadow: 0 6px 18px rgba(232,23,93,0.4);
    animation: pop 0.5s cubic-bezier(0.34, 1.56, 0.64, 1) backwards;
  }
  @keyframes pop { from { opacity: 0; transform: scale(0.3); } to { opacity: 1; transform: scale(1); } }
  .success-msg h3 {
    font-family: 'Dancing Script', cursive; font-size: 38px;
    color: var(--hot-pink); margin-bottom: 12px; line-height: 1;
  }
  .success-msg p { font-size: 13px; color: #555; line-height: 1.7; margin-bottom: 6px; }
  .success-msg .small { font-size: 11px; color: #999; margin-top: 14px; letter-spacing: 0.05em; }

  /* ── STATE MACHINE ── */

  /* OPENING */
  .stage[data-state="opening"] .env-flap { transform: rotateX(-180deg); }
  .stage[data-state="opening"] .env-seal { opacity: 0; transform: translate(-50%, -50%) scale(0.3) rotate(15deg); }
  .stage[data-state="opening"] .open-hint { opacity: 0; }
  .stage[data-state="opening"] .envelope { animation: none; cursor: default; }

  /* OPEN — envelope out of flow, card centered */
  .stage[data-state="open"] {
    justify-content: flex-start;
    padding-top: 30px;
    overflow: visible;
    min-height: 100vh;
  }
  .stage[data-state="open"] .envelope-wrap {
    position: absolute;
    top: 50%; left: 50%;
    transform: translate(-50%, -50%) scale(0.7);
    opacity: 0;
    pointer-events: none;
  }
  .stage[data-state="open"] .card-stage {
    position: relative;
    top: auto; left: auto;
    transform: none;
    opacity: 1;
    pointer-events: auto;
    margin: 0 auto;
  }

  /* FORM — card flipped */
  .stage[data-state="form"] {
    justify-content: flex-start;
    padding-top: 30px;
    overflow: visible;
    min-height: 100vh;
  }
  .stage[data-state="form"] .envelope-wrap {
    position: absolute;
    top: 50%; left: 50%;
    transform: translate(-50%, -50%) scale(0.7);
    opacity: 0;
    pointer-events: none;
  }
  .stage[data-state="form"] .card-stage {
    position: relative;
    top: auto; left: auto;
    transform: none;
    opacity: 1;
    pointer-events: auto;
    margin: 0 auto;
  }
  .stage[data-state="form"] .card-3d { transform: rotateY(180deg); }

  /* FOOTER */
  .footer {
    text-align: center; padding: 24px 20px;
    font-size: 9px; letter-spacing: 0.25em;
    color: rgba(255,255,255,0.2); text-transform: uppercase;
    margin-top: auto;
  }
  .footer span { color: var(--hot-pink); }

  /* REDUCED MOTION */
  @media (prefers-reduced-motion: reduce) {
    .envelope { animation: none; }
    .env-flap, .card-stage, .card-3d, .envelope-wrap, .open-hint, .check-icon, .env-seal {
      transition-duration: 0.15s !important;
      animation: none !important;
    }
  }

  /* MOBILE */
  @media (max-width: 600px) {
    .card-back { padding: 24px 18px; }
    .form-row { flex-direction: column; gap: 0; }
    .form-title { font-size: 30px; }
    .envelope { width: 85vw; height: calc(85vw * 0.66); }
    .env-seal { width: 72px; height: 72px; }
  }

  /* ── BALLOONS — float out of envelope on open ── */
  .balloons {
    position: absolute;
    top: 50%; left: 50%;
    width: 0; height: 0;
    pointer-events: none;
    z-index: 8;
  }
  .balloon {
    position: absolute;
    bottom: 0; left: 0;
    width: 50px;
    transform: translate(-50%, 0) scale(0);
    opacity: 0;
    will-change: transform, opacity;
  }
  .balloon svg { display: block; width: 100%; height: auto; filter: drop-shadow(0 6px 10px rgba(232,23,93,0.35)); }

  /* trigger when envelope opens — keep playing through state changes */
  .stage[data-state="opening"] .balloon-1,
  .stage[data-state="open"] .balloon-1,
  .stage[data-state="form"] .balloon-1 { animation: float1 2.64s cubic-bezier(0.25, 0.46, 0.45, 0.94) 0.0s forwards; }
  .stage[data-state="opening"] .balloon-2,
  .stage[data-state="open"] .balloon-2,
  .stage[data-state="form"] .balloon-2 { animation: float2 2.03s cubic-bezier(0.25, 0.46, 0.45, 0.94) 0.06s forwards; }
  .stage[data-state="opening"] .balloon-3,
  .stage[data-state="open"] .balloon-3,
  .stage[data-state="form"] .balloon-3 { animation: float3 2.28s cubic-bezier(0.25, 0.46, 0.45, 0.94) 0.12s forwards; }
  .stage[data-state="opening"] .balloon-4,
  .stage[data-state="open"] .balloon-4,
  .stage[data-state="form"] .balloon-4 { animation: float4 2.22s cubic-bezier(0.25, 0.46, 0.45, 0.94) 0.18s forwards; }
  .stage[data-state="opening"] .balloon-5,
  .stage[data-state="open"] .balloon-5,
  .stage[data-state="form"] .balloon-5 { animation: float5 2.74s cubic-bezier(0.25, 0.46, 0.45, 0.94) 0.24s forwards; }
  .stage[data-state="opening"] .balloon-6,
  .stage[data-state="open"] .balloon-6,
  .stage[data-state="form"] .balloon-6 { animation: float6 2.68s cubic-bezier(0.25, 0.46, 0.45, 0.94) 0.3s forwards; }
  .stage[data-state="opening"] .balloon-7,
  .stage[data-state="open"] .balloon-7,
  .stage[data-state="form"] .balloon-7 { animation: float7 2.89s cubic-bezier(0.25, 0.46, 0.45, 0.94) 0.36s forwards; }
  .stage[data-state="opening"] .balloon-8,
  .stage[data-state="open"] .balloon-8,
  .stage[data-state="form"] .balloon-8 { animation: float8 2.09s cubic-bezier(0.25, 0.46, 0.45, 0.94) 0.42s forwards; }
  .stage[data-state="opening"] .balloon-9,
  .stage[data-state="open"] .balloon-9,
  .stage[data-state="form"] .balloon-9 { animation: float9 2.42s cubic-bezier(0.25, 0.46, 0.45, 0.94) 0.48s forwards; }
  .stage[data-state="opening"] .balloon-10,
  .stage[data-state="open"] .balloon-10,
  .stage[data-state="form"] .balloon-10 { animation: float10 2.03s cubic-bezier(0.25, 0.46, 0.45, 0.94) 0.54s forwards; }
  .stage[data-state="opening"] .balloon-11,
  .stage[data-state="open"] .balloon-11,
  .stage[data-state="form"] .balloon-11 { animation: float11 2.22s cubic-bezier(0.25, 0.46, 0.45, 0.94) 0.6s forwards; }
  .stage[data-state="opening"] .balloon-12,
  .stage[data-state="open"] .balloon-12,
  .stage[data-state="form"] .balloon-12 { animation: float12 2.51s cubic-bezier(0.25, 0.46, 0.45, 0.94) 0.66s forwards; }
  .stage[data-state="opening"] .balloon-13,
  .stage[data-state="open"] .balloon-13,
  .stage[data-state="form"] .balloon-13 { animation: float13 2.03s cubic-bezier(0.25, 0.46, 0.45, 0.94) 0.72s forwards; }
  .stage[data-state="opening"] .balloon-14,
  .stage[data-state="open"] .balloon-14,
  .stage[data-state="form"] .balloon-14 { animation: float14 2.2s cubic-bezier(0.25, 0.46, 0.45, 0.94) 0.78s forwards; }
  .stage[data-state="opening"] .balloon-15,
  .stage[data-state="open"] .balloon-15,
  .stage[data-state="form"] .balloon-15 { animation: float15 2.65s cubic-bezier(0.25, 0.46, 0.45, 0.94) 0.84s forwards; }
  .stage[data-state="opening"] .balloon-16,
  .stage[data-state="open"] .balloon-16,
  .stage[data-state="form"] .balloon-16 { animation: float16 2.54s cubic-bezier(0.25, 0.46, 0.45, 0.94) 0.9s forwards; }
  /* drift trajectories — emerge from envelope center, rise upward with sway */
  @keyframes float1 {
    0%   { transform: translate(-50%, 0) scale(0) rotate(0deg); opacity: 0; }
    20%  { opacity: 1; }
    100% { transform: translate(calc(-50% + -112px), -718px) scale(1) rotate(9.3deg); opacity: 1; }
  }
  @keyframes float2 {
    0%   { transform: translate(-50%, 0) scale(0) rotate(0deg); opacity: 0; }
    20%  { opacity: 1; }
    100% { transform: translate(calc(-50% + -197px), -761px) scale(1) rotate(5.9deg); opacity: 1; }
  }
  @keyframes float3 {
    0%   { transform: translate(-50%, 0) scale(0) rotate(0deg); opacity: 0; }
    20%  { opacity: 1; }
    100% { transform: translate(calc(-50% + -64px), -631px) scale(1) rotate(13.7deg); opacity: 1; }
  }
  @keyframes float4 {
    0%   { transform: translate(-50%, 0) scale(0) rotate(0deg); opacity: 0; }
    20%  { opacity: 1; }
    100% { transform: translate(calc(-50% + -65px), -619px) scale(1) rotate(-12.1deg); opacity: 1; }
  }
  @keyframes float5 {
    0%   { transform: translate(-50%, 0) scale(0) rotate(0deg); opacity: 0; }
    20%  { opacity: 1; }
    100% { transform: translate(calc(-50% + 139px), -721px) scale(1) rotate(9.2deg); opacity: 1; }
  }
  @keyframes float6 {
    0%   { transform: translate(-50%, 0) scale(0) rotate(0deg); opacity: 0; }
    20%  { opacity: 1; }
    100% { transform: translate(calc(-50% + 92px), -707px) scale(1) rotate(14.2deg); opacity: 1; }
  }
  @keyframes float7 {
    0%   { transform: translate(-50%, 0) scale(0) rotate(0deg); opacity: 0; }
    20%  { opacity: 1; }
    100% { transform: translate(calc(-50% + -49px), -710px) scale(1) rotate(9.9deg); opacity: 1; }
  }
  @keyframes float8 {
    0%   { transform: translate(-50%, 0) scale(0) rotate(0deg); opacity: 0; }
    20%  { opacity: 1; }
    100% { transform: translate(calc(-50% + 47px), -772px) scale(1) rotate(2.3deg); opacity: 1; }
  }
  @keyframes float9 {
    0%   { transform: translate(-50%, 0) scale(0) rotate(0deg); opacity: 0; }
    20%  { opacity: 1; }
    100% { transform: translate(calc(-50% + 82px), -609px) scale(1) rotate(-8.2deg); opacity: 1; }
  }
  @keyframes float10 {
    0%   { transform: translate(-50%, 0) scale(0) rotate(0deg); opacity: 0; }
    20%  { opacity: 1; }
    100% { transform: translate(calc(-50% + -84px), -616px) scale(1) rotate(-8.0deg); opacity: 1; }
  }
  @keyframes float11 {
    0%   { transform: translate(-50%, 0) scale(0) rotate(0deg); opacity: 0; }
    20%  { opacity: 1; }
    100% { transform: translate(calc(-50% + -160px), -656px) scale(1) rotate(4.1deg); opacity: 1; }
  }
  @keyframes float12 {
    0%   { transform: translate(-50%, 0) scale(0) rotate(0deg); opacity: 0; }
    20%  { opacity: 1; }
    100% { transform: translate(calc(-50% + -54px), -674px) scale(1) rotate(-8.7deg); opacity: 1; }
  }
  @keyframes float13 {
    0%   { transform: translate(-50%, 0) scale(0) rotate(0deg); opacity: 0; }
    20%  { opacity: 1; }
    100% { transform: translate(calc(-50% + -93px), -787px) scale(1) rotate(4.4deg); opacity: 1; }
  }
  @keyframes float14 {
    0%   { transform: translate(-50%, 0) scale(0) rotate(0deg); opacity: 0; }
    20%  { opacity: 1; }
    100% { transform: translate(calc(-50% + 44px), -634px) scale(1) rotate(6.9deg); opacity: 1; }
  }
  @keyframes float15 {
    0%   { transform: translate(-50%, 0) scale(0) rotate(0deg); opacity: 0; }
    20%  { opacity: 1; }
    100% { transform: translate(calc(-50% + -135px), -676px) scale(1) rotate(14.7deg); opacity: 1; }
  }
  @keyframes float16 {
    0%   { transform: translate(-50%, 0) scale(0) rotate(0deg); opacity: 0; }
    20%  { opacity: 1; }
    100% { transform: translate(calc(-50% + 56px), -711px) scale(1) rotate(5.5deg); opacity: 1; }

  @media (prefers-reduced-motion: reduce) {

            <div class="form-row">
              <div class="form-group">
                <label for="firstName">First Name <span class="req">*</span></label>
                <input type="text" id="firstName" name="firstName" required autocomplete="given-name"/>
              </div>
              <div class="form-group">

              <label for="phone">Phone <span class="opt">(optional)</span></label>

              <label for="attending">Will You Attend? <span class="req">*</span></label>

              <input type="text" id="website" name="website" tabindex="-1" autocomplete="off"/>

<script>
  const FORM_ENDPOINT = 'https://docs.google.com/forms/d/e/1FAIpQLSddfXYTbOgqy_nmgngUF0qgtWtAs5azByiFomTCNp_stiSU8A/formResponse';
  const FORM_ENTRIES = {
    firstName: 'entry.1842013731',
    lastName:  'entry.330028428',
    email:     'entry.585956359',
    phone:     'entry.5284474',
    attending: 'entry.1167228532',
    dietary:   'entry.1630656575',
    message:   'entry.1152236651',
  };
  const ATTENDING_MAP = {
    yes:   "Yes, I'll be there!",
    no:    "Sadly, I can't make it",
  };

  const stage = document.getElementById('stage');
  const form = document.getElementById('rsvpForm');
  const errBox = document.getElementById('formError');
  const submitBtn = document.getElementById('submitBtn');
  const successMsg = document.getElementById('successMsg');
  const formContainer = document.getElementById('formContainer');

  /* ── Envelope open ── */
  function openEnvelope() {
    if (stage.dataset.state !== 'closed') return;
    stage.dataset.state = 'opening';
    setTimeout(() => { stage.dataset.state = 'open'; }, 1200);
  }
  document.getElementById('envelope').addEventListener('keydown', e => {
    if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); openEnvelope(); }
  });

  /* ── Card flip ── */
  function flipToForm() {
    stage.dataset.state = 'form';
    setTimeout(() => {
      const f = document.getElementById('firstName');
      if (f) f.focus({preventScroll: true});
    }, 1050);
  }
  function flipToCard() { stage.dataset.state = 'open'; }

  /* ── Form ── */
  function showError(msg, fields = []) {
    errBox.textContent = msg;
    errBox.style.display = 'block';
    document.querySelectorAll('.error').forEach(el => el.classList.remove('error'));
    fields.forEach(f => { const el = document.getElementById(f); if (el) el.classList.add('error'); });
  }
  function clearError() {
    errBox.style.display = 'none';
    document.querySelectorAll('.error').forEach(el => el.classList.remove('error'));
  }
  function isValidEmail(e) { return /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(e); }

  form.addEventListener('submit', async function(ev) {
    ev.preventDefault();
    clearError();

    const data = {
      firstName: document.getElementById('firstName').value.trim(),
      lastName:  document.getElementById('lastName').value.trim(),
      email:     document.getElementById('email').value.trim(),
      phone:     document.getElementById('phone').value.trim(),
      attending: document.getElementById('attending').value,
      dietary:   document.getElementById('dietary').value.trim(),
      message:   document.getElementById('message').value.trim(),
      website:   document.getElementById('website').value
    };

    if (data.website) {
      formContainer.style.display = 'none';
      successMsg.style.display = 'block';
      return;
    }

    const missing = [];
    if (!data.firstName) missing.push('firstName');
    if (!data.lastName)  missing.push('lastName');
    if (!data.email)     missing.push('email');
    if (!data.attending) missing.push('attending');
    if (missing.length) { showError('Please fill in all required fields.', missing); return; }
    if (!isValidEmail(data.email)) { showError('Please enter a valid email address.', ['email']); return; }

    submitBtn.disabled = true;
    submitBtn.textContent = 'Sending...';

    const fd = new FormData();
    fd.append(FORM_ENTRIES.firstName, data.firstName);
    fd.append(FORM_ENTRIES.lastName,  data.lastName);
    fd.append(FORM_ENTRIES.email,     data.email);
    fd.append(FORM_ENTRIES.phone,     data.phone);
    fd.append(FORM_ENTRIES.attending, ATTENDING_MAP[data.attending] || data.attending);
    fd.append(FORM_ENTRIES.dietary,   data.dietary);
    fd.append(FORM_ENTRIES.message,   data.message);

    try {
      await fetch(FORM_ENDPOINT, {
        method: 'POST',
        mode: 'no-cors',
        body: fd
      });
      formContainer.style.display = 'none';
      successMsg.style.display = 'block';
    } catch (err) {
      submitBtn.disabled = false;
      submitBtn.textContent = 'Send RSVP';
      showError('Something went wrong. Please try again or text the host.');
      console.error(err);
    }
  });

  ['firstName','lastName','email','attending'].forEach(id => {
    document.getElementById(id).addEventListener('input', () => {
      document.getElementById(id).classList.remove('error');
    });
  });
</script>
</body>
</html>
