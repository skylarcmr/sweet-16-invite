<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 800" width="720" height="800">
  <defs>
    <!-- envelope colors -->
    <linearGradient id="env_back_grad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f9d6e7"/>
      <stop offset="100%" stop-color="#e8175d"/>
    </linearGradient>
    <linearGradient id="env_front_grad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fce8f0"/>
      <stop offset="100%" stop-color="#f7c8d8"/>
    </linearGradient>
    <linearGradient id="env_flap_grad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e8175d"/>
      <stop offset="100%" stop-color="#b50e48"/>
    </linearGradient>
    <radialGradient id="stage_bg" cx="50%" cy="30%" r="65%">
      <stop offset="0%" stop-color="#2a1820"/>
      <stop offset="100%" stop-color="#0d0d0d"/>
    </radialGradient>

    <!-- balloon colors -->
    <radialGradient id="grad_hotpink" cx="32%" cy="28%" r="65%">
      <stop offset="0%" stop-color="#ffc4d8"/>
      <stop offset="35%" stop-color="#ff5a99"/>
      <stop offset="70%" stop-color="#e8175d"/>
      <stop offset="100%" stop-color="#8b0a35"/>
    </radialGradient>
    <radialGradient id="grad_lightpink" cx="32%" cy="28%" r="65%">
      <stop offset="0%" stop-color="#ffe6f0"/>
      <stop offset="40%" stop-color="#ffb3cc"/>
      <stop offset="80%" stop-color="#ff8aaf"/>
      <stop offset="100%" stop-color="#c75a85"/>
    </radialGradient>
    <radialGradient id="grad_magenta" cx="32%" cy="28%" r="65%">
      <stop offset="0%" stop-color="#ffb0e0"/>
      <stop offset="35%" stop-color="#ff3399"/>
      <stop offset="70%" stop-color="#c80f6f"/>
      <stop offset="100%" stop-color="#5a042f"/>
    </radialGradient>
    <radialGradient id="grad_black" cx="32%" cy="28%" r="65%">
      <stop offset="0%" stop-color="#9a9a9a"/>
      <stop offset="35%" stop-color="#3a3a3a"/>
      <stop offset="70%" stop-color="#161616"/>
      <stop offset="100%" stop-color="#000"/>
    </radialGradient>
    <radialGradient id="grad_gold" cx="32%" cy="28%" r="65%">
      <stop offset="0%" stop-color="#fff4cf"/>
      <stop offset="35%" stop-color="#f3d27a"/>
      <stop offset="70%" stop-color="#c89c2e"/>
      <stop offset="100%" stop-color="#7a5a10"/>
    </radialGradient>
    <linearGradient id="stringGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="rgba(180,180,180,0.7)"/>
      <stop offset="100%" stop-color="rgba(180,180,180,0.1)"/>
    </linearGradient>

    <filter id="env_shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="20" stdDeviation="15" flood-color="#e8175d" flood-opacity="0.3"/>
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#000" flood-opacity="0.5"/>
    </filter>
    <filter id="balloon_shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="4" flood-color="#e8175d" flood-opacity="0.35"/>
    </filter>
  </defs>
  <!-- stage background -->
  <rect id="stage-bg" width="720" height="800" fill="url(#stage_bg)"/>

