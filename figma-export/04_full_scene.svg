  <!-- envelope -->
  <g id="envelope" transform="translate(180.0, 280.0)" filter="url(#env_shadow)">
    <rect id="env-back" width="360" height="240" rx="6" fill="url(#env_back_grad)"/>
    <polygon id="env-front" points="0,108.0 180.0,240 360,108.0 360,240 0,240" fill="url(#env_front_grad)"/>
    <polygon id="env-front-sheen" points="0,108.0 180.0,240 360,108.0 360,240 0,240" fill="rgba(232,23,93,0.06)"/>
    <polygon id="env-flap" points="0,0 360,0 180.0,115.19999999999999" fill="url(#env_flap_grad)"/>
    <image id="env-seal" href="seal.png" x="135.0" y="70.19999999999999" width="90" height="90"/>
  </g>

  <!-- "TAP TO OPEN" label -->
  <text x="360.0" y="576.0" text-anchor="middle"
